# --- Start title (shown to everyone; timing in config.yml -> start-title) ---
# {zone} {duration} {duration_human}
title-start: '&8· <gradient:#FA912E:#EFF665>&lBANG HỘI CHIẾN</gradient> &8·'
subtitle-start: '&fĐã bắt đầu tại &6trung tâm'

# --- Broadcasts ---
# {zone} {duration} {duration_human}
broadcast-start: '<gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &fđã bắt đầu! &bThời gian: &b{duration_human}'
# Reminder before a scheduled start (config.yml -> scheduler.reminder / announce-before-seconds).
# {zone} {human} (e.g. "5 phút") {minutes} {seconds} {time} (mm:ss)
schedule-announce: '&fSự kiện <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &ftại &ckhu vực trung tâm bản đồ &fsẽ bắt đầu sau &c{human}&f!'
broadcast-end-header: '<gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> đã kết thúc! &fKết quả:'
# Sent without prefix. {rank} {clan} {time}
broadcast-end-line: '  &f#{rank} &f{clan} &7- &a{time}'
broadcast-end-no-rewards: '&7(Trận này không phát thưởng)'
broadcast-end-no-winner: '<gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &fđã kết thúc, không có clan nào chiếm được.'
broadcast-cancelled: '<gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &cđã bị huỷ.'
