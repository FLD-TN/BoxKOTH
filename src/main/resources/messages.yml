clan-locked: '&cKhông thể {action} khi <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &cđang diễn ra!'
clan-lock-actions:
  create: 'tạo bang'
  disband: 'giải tán bang'
  leave: 'rời bang'
  join: 'vào bang'
  kick: 'kick thành viên'
  invite: 'mời người vào bang'
  transfer: 'chuyển chủ bang'
