# ClanKoth messages. Supports & colour codes and &#RRGGBB. An empty string disables a message.
# Tokens in {braces} are filled by the plugin.

prefix: '&8(<#33FD42>&lB<#44F651>&lo<#55EF60>&lx<#65E96F>&lP<#76E27E>&lv<#87DB8D>&lP&8) '

# Unit words for human-readable times ({human}, {duration_human}, {remaining_human}, ...)
unit-hour: 'giờ'
unit-minute: 'phút'
unit-second: 'giây'

# --- Player commands: /koth and /koth time ---
# {timezone}
player-schedule-header:
  - '&8&m                                        '
  - '&6&lLỊCH <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient>'
# {zone} {time_left} {time_left_human}
player-schedule-running:
  - '&a● <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &a&lĐANG DIỄN RA &7- còn &f{time_left_human}'
# {zone} {next} {remaining} {remaining_human}
player-schedule-entry:
  - '&f● <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient> &7lúc &a{next} &7(còn &f{remaining_human}&7)'
player-schedule-empty:
  - '&7Hiện chưa có lịch bang hội chiến nào.'
player-schedule-footer:
  - '&8&m                                        '

# --- Commands ---
no-permission: '&cBạn không có quyền.'
player-only: '&cLệnh này chỉ dùng trong game.'
# Shown to everyone (clankoth.player)
usage-player:
  - '&6&lClanKoth'
  - '&f/koth &7hoặc &f/koth time &7- xem lịch bang hội chiến'
# Additionally shown to clankoth.start
usage:
  - '&f/koth start <tên> [giây] &7- bắt đầu ngay (10-86400 giây)'
  - '&f/koth stop <tên> [--no-rewards] &7- kết thúc'
  - '&f/koth schedule &7- lịch bang hội chiến chi tiết'
  - '&f/koth list &7- danh sách vùng'
  - '&f/koth info <tên> &7- thông tin vùng'
# Additionally shown to clankoth.admin
usage-admin:
  - '&f/koth pos1 &7| &f/koth pos2 &7- chọn 2 góc vùng'
  - '&f/koth create <tên> &7- tạo vùng từ pos1/pos2'
  - '&f/koth delete <tên> &7- xoá vùng'
  - '&f/koth set <tên> radius <0-1000|default> &7- bán kính arena'
  - '&f/koth set <tên> duration <10-86400|default> &7- thời lượng (giây)'
  - '&f/koth holo <movehere|reset> <tên> &7- vị trí hologram'
  - '&f/koth infoholo <movehere|reset> <tên> &7- vị trí hologram thông tin'
  - '&f/koth reload &7- tải lại cấu hình và zones.yml'
usage-create: '&cCách dùng: /koth create <tên>'
usage-delete: '&cCách dùng: /koth delete <tên>'
usage-info: '&cCách dùng: /koth info <tên>'
