# --- Phần thưởng ---
# Mỗi người nhận 1 khối duy nhất: reward-header, 1 dòng cho mỗi phần quà nhận được, rồi reward-footer.
# Không có prefix. Token: {rank} {zone} {clan} {clan_time} {player_time}
# Để '' thì dòng quà đó không hiện; header/footer để [] thì bỏ.
reward-header:
  - '&8&m                                        '
  - '<gradient:#FA912E:#EFF665>&lBANG HỘI CHIẾN</gradient> &8┃ &fPhần thưởng'
  - '&7Bang &f{clan} &7xếp &6&lhạng {rank} &8· &7chiếm giữ &b{clan_time}'
  - ''
reward-leader: ' &6▸ &fQuà &6Trưởng Bang'
# Phó Bang nhận thay quà Trưởng Bang khi Minh Chủ offline (rewards.yml -> vice-stands-in-for-leader)
reward-leader-stand-in: ' &6- &fQuà &6Trưởng Bang &7(nhận thay Minh Chủ đang offline)'
reward-mvp: ' &d▸ &fQuà &dMVP &8(&7bạn giữ vùng &b{player_time}&8)'
reward-members: ' &a▸ &fQuà &aThành Viên'
reward-footer:
  - '&8&m                                        '

# ===== MỚI =====
# Màu hỗ trợ (cả trong config.yml: hologram, bossbar):
#   &a &l ...                         mã thường
#   &#FA912E  <#FA912E>  {#FA912E}    hex
#   &x&F&A&9&1&2&f                    hex kiểu Spigot / EssentialsX
#   <gradient:#FA912E:#EFF665>&lBang Hội Chiến</gradient>   gradient, 2 màu trở lên

# Khi có bang hội MỚI chiếm vùng, gửi cho mọi người chơi.
# config.yml -> controller-change-display: CHAT (dùng capture-chat) | ACTIONBAR (dùng capture-actionbar) | NONE
# Không có prefix. {clan} {player} {zone}
capture-chat: '&8(<#FA912E>&lB<#F99932>&la<#F8A136>&ln<#F7A83B>&lg <#F6B843>&lH<#F5C047>&lộ<#F4C74C>&li <#F2D754>&lC<#F2DF58>&lh<#F1E65D>&li<#F0EE61>&lế<#EFF665>&ln&8) &fBang hội &f{clan} &fđang chiếm giữ địa bàn tại khu vực &6trung tâm&f.'
capture-actionbar: '&fBang hội &f{clan} &fđang chiếm giữ địa bàn tại khu vực &6trung tâm'

# /koth infoholo (holo thông tin "chưa diễn ra / trận kế tiếp")
usage-infoholo: '&cCách dùng: /koth infoholo <movehere|reset> <tên>'
infoholo-moved: '&aĐã chuyển hologram thông tin của &f{zone} &ađến vị trí của bạn.'
